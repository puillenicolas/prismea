# Déploiement Render (Blueprint) : application web + base PostgreSQL
services:
  - type: web
    name: prismea
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: prismea-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: INIT_PASSWORD
        sync: false
      - key: DHL_API_KEY
        sync: false
      - key: DHL_INTERVAL_MIN
        value: "60"

databases:
  - name: prismea-db
    plan: basic-256mb
    region: frankfurt
    databaseName: prismea
    user: prismea
